name: Build and Deploy Go App

on:
 push:
  branches:
  - main
 workflow_dispatch:

jobs:
 deploy:
  runs-on: self-hosted

  steps:
   - name: Checkout repository
     uses: actions/checkout@v4

   - name: Check Docker
     run: |
      docker --version
      docker info

   - name: Build Docker image
     run: docker build -t go-cicd:latest .

   - name: Stop previous container
     run: docker rm -f go-cicd-app || true

   - name: Start new container
     run: |
      docker run -d \
        --name go-cicd-app \
        --restart unless-stopped \
        -p 8083:8888 \
        go-cicd:latest

   - name: Check application
     run: |
      for i in $(seq 1 15); do
        if curl --fail --silent http://localhost:8083/health; then
          echo ""
          curl --fail http://localhost:8083/
          exit 0
        fi
        sleep 2
      done
      echo "Application did not start"
      docker logs go-cicd-app
      exit 1
